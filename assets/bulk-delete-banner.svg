<svg width="1000" height="190" viewBox="0 0 1000 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bulk Delete for ChatGPT — a privacy-first browser extension available on Firefox Add-ons.">
  <defs>
    <linearGradient id="bd-bg" x1="0" y1="0" x2="1000" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <radialGradient id="bd-glow" cx="0" cy="0" r="1" gradientTransform="translate(960 20) rotate(160) scale(420 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7768e" stop-opacity=".18"/>
      <stop offset="1" stop-color="#f7768e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bd-name" x1="42" y1="76" x2="520" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7768e"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <pattern id="bd-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2a2e42"/>
    </pattern>
    <clipPath id="bd-clip"><rect width="1000" height="190" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#bd-clip)">
    <rect width="1000" height="190" fill="url(#bd-bg)"/>
    <rect width="1000" height="190" fill="url(#bd-glow)"/>
    <rect width="1000" height="190" fill="url(#bd-dots)" opacity=".45"/>
    <rect width="5" height="190" fill="#f7768e"/>
    <text x="42" y="52" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" fill="#f7768e" letter-spacing="3">PRIVACY-FIRST · FIREFOX ADD-ON</text>
    <text x="42" y="104" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="url(#bd-name)">Bulk Delete for ChatGPT</text>
    <text x="44" y="132" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" fill="#a9b1d6">Choose the conversations. Delete only what you select.</text>
    <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12">
      <rect x="42" y="150" width="112" height="28" rx="14" fill="#1f2335" stroke="#f7768e"/>
      <text x="56" y="169" fill="#f7768e">Firefox</text>
      <rect x="166" y="150" width="142" height="28" rx="14" fill="#1f2335" stroke="#bb9af7"/>
      <text x="180" y="169" fill="#bb9af7">No telemetry</text>
      <rect x="320" y="150" width="102" height="28" rx="14" fill="#1f2335" stroke="#7aa2f7"/>
      <text x="334" y="169" fill="#7aa2f7">Open source</text>
    </g>
  </g>
</svg>
