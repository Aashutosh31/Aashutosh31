<svg width="1000" height="190" viewBox="0 0 1000 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SIH Intelligence — an AI platform that analyzes Smart India Hackathon problem statements into execution plans.">
  <defs>
    <linearGradient id="s-bg" x1="0" y1="0" x2="1000" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <radialGradient id="s-gl" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 20) rotate(160) scale(420 320)">
      <stop stop-color="#7dcfff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s-name" x1="42" y1="76" x2="380" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="s-bar" x1="0" y1="0" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <pattern id="s-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2a2e42"/>
    </pattern>
    <clipPath id="s-clip"><rect width="1000" height="190" rx="16"/></clipPath>
    <style>
      .sgauge{animation:sgrow 3s ease-out infinite}
      @keyframes sgrow{0%{stroke-dashoffset:188.5}55%{stroke-dashoffset:52}100%{stroke-dashoffset:52}}
    </style>
  </defs>
  <g clip-path="url(#s-clip)">
    <rect width="1000" height="190" fill="url(#s-bg)"/>
    <rect width="1000" height="190" fill="url(#s-gl)"/>
    <rect width="1000" height="190" fill="url(#s-dots)" opacity=".45"/>
    <rect width="5" height="190" fill="url(#s-bar)"/>

    <text x="42" y="52" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" fill="#7dcfff" letter-spacing="3">AI · GEMINI</text>
    <text x="42" y="104" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="url(#s-name)">SIH Intelligence</text>
    <text x="44" y="132" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" fill="#a9b1d6">Turning problem statements into scored execution plans</text>
    <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12">
      <rect x="42" y="150" width="76" height="28" rx="14" fill="#1f2335" stroke="#7dcfff"/>
      <text x="56" y="169" fill="#7dcfff">React</text>
      <rect x="130" y="150" width="90" height="28" rx="14" fill="#1f2335" stroke="#7aa2f7"/>
      <text x="144" y="169" fill="#7aa2f7">Express</text>
      <rect x="232" y="150" width="88" height="28" rx="14" fill="#1f2335" stroke="#bb9af7"/>
      <text x="246" y="169" fill="#bb9af7">Gemini</text>
    </g>

    <rect x="660" y="40" width="190" height="110" rx="14" fill="#1f2335" stroke="#2f334d"/>
    <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="10" fill="#a9b1d6">
      <text x="676" y="62">difficulty</text>
      <rect x="676" y="68" width="158" height="7" rx="3.5" fill="#24283b"/>
      <rect x="676" y="68" width="112" height="7" rx="3.5" fill="#7dcfff"/>
      <text x="676" y="90">risk</text>
      <rect x="676" y="96" width="158" height="7" rx="3.5" fill="#24283b"/>
      <rect x="676" y="96" width="74" height="7" rx="3.5" fill="#bb9af7"/>
      <text x="676" y="118">team-fit</text>
      <rect x="676" y="124" width="158" height="7" rx="3.5" fill="#24283b"/>
      <rect x="676" y="124" width="132" height="7" rx="3.5" fill="#9ece6a"/>
    </g>

    <circle cx="895" cy="95" r="30" fill="none" stroke="#24283b" stroke-width="6"/>
    <circle class="sgauge" cx="895" cy="95" r="30" fill="none" stroke="#7dcfff" stroke-width="6" stroke-linecap="round" stroke-dasharray="188.5 188.5" transform="rotate(-90 895 95)"/>
    <text x="895" y="100" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" font-weight="700" fill="#9ece6a">GO</text>
    <text x="895" y="140" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="10" fill="#565f89">verdict</text>
  </g>
</svg>
