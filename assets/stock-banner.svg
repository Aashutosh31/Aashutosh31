<svg width="1000" height="190" viewBox="0 0 1000 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stock Suggestion — a full-stack stock suggestion and tracking app with realtime WebSocket updates.">
  <defs>
    <linearGradient id="k-bg" x1="0" y1="0" x2="1000" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <radialGradient id="k-gl" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 20) rotate(160) scale(420 320)">
      <stop stop-color="#9ece6a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#9ece6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="k-name" x1="42" y1="76" x2="360" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#9ece6a"/>
    </linearGradient>
    <linearGradient id="k-bar" x1="0" y1="0" x2="0" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#9ece6a"/>
    </linearGradient>
    <pattern id="k-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2a2e42"/>
    </pattern>
    <clipPath id="k-clip"><rect width="1000" height="190" rx="16"/></clipPath>
    <style>
      .kline{stroke-dasharray:6 6;animation:kdash 4s linear infinite}
      @keyframes kdash{to{stroke-dashoffset:-120}}
      .kdot{animation:kpulse 2.2s ease-in-out infinite}
      @keyframes kpulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#k-clip)">
    <rect width="1000" height="190" fill="url(#k-bg)"/>
    <rect width="1000" height="190" fill="url(#k-gl)"/>
    <rect width="1000" height="190" fill="url(#k-dots)" opacity=".45"/>
    <rect width="5" height="190" fill="url(#k-bar)"/>

    <text x="42" y="52" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" fill="#7aa2f7" letter-spacing="3">FULL-STACK · WEBSOCKETS</text>
    <text x="42" y="104" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="url(#k-name)">Stock Suggestion</text>
    <text x="44" y="132" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" fill="#a9b1d6">Suggestions &amp; tracking with realtime WebSocket updates</text>
    <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12">
      <rect x="42" y="150" width="76" height="28" rx="14" fill="#1f2335" stroke="#7dcfff"/>
      <text x="56" y="169" fill="#7dcfff">React</text>
      <rect x="130" y="150" width="90" height="28" rx="14" fill="#1f2335" stroke="#9ece6a"/>
      <text x="144" y="169" fill="#9ece6a">Express</text>
      <rect x="232" y="150" width="102" height="28" rx="14" fill="#1f2335" stroke="#7aa2f7"/>
      <text x="246" y="169" fill="#7aa2f7">MongoDB</text>
    </g>

    <g stroke-width="1.6">
      <line x1="668" y1="113" x2="668" y2="137" stroke="#f7768e"/>
      <rect x="664" y="118" width="8" height="14" rx="2" fill="#f7768e"/>
      <line x1="694" y1="99" x2="694" y2="127" stroke="#9ece6a"/>
      <rect x="690" y="104" width="8" height="18" rx="2" fill="#9ece6a"/>
      <line x1="720" y1="91" x2="720" y2="115" stroke="#9ece6a"/>
      <rect x="716" y="96" width="8" height="14" rx="2" fill="#9ece6a"/>
      <line x1="746" y1="95" x2="746" y2="121" stroke="#f7768e"/>
      <rect x="742" y="100" width="8" height="16" rx="2" fill="#f7768e"/>
      <line x1="772" y1="79" x2="772" y2="107" stroke="#9ece6a"/>
      <rect x="768" y="84" width="8" height="18" rx="2" fill="#9ece6a"/>
      <line x1="798" y1="69" x2="798" y2="97" stroke="#9ece6a"/>
      <rect x="794" y="74" width="8" height="18" rx="2" fill="#9ece6a"/>
      <line x1="824" y1="75" x2="824" y2="101" stroke="#f7768e"/>
      <rect x="820" y="80" width="8" height="16" rx="2" fill="#f7768e"/>
      <line x1="850" y1="59" x2="850" y2="87" stroke="#9ece6a"/>
      <rect x="846" y="64" width="8" height="18" rx="2" fill="#9ece6a"/>
      <line x1="876" y1="49" x2="876" y2="77" stroke="#9ece6a"/>
      <rect x="872" y="54" width="8" height="18" rx="2" fill="#9ece6a"/>
      <line x1="902" y1="55" x2="902" y2="81" stroke="#f7768e"/>
      <rect x="898" y="60" width="8" height="16" rx="2" fill="#f7768e"/>
    </g>
    <polyline class="kline" points="668,118 694,104 720,96 746,100 772,84 798,74 824,80 850,64 876,54 902,60" fill="none" stroke="#7dcfff" stroke-width="1.6" opacity=".7"/>

    <circle cx="944" cy="54" r="4" fill="#9ece6a" class="kdot"/>
    <text x="956" y="58" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="10" fill="#565f89">live</text>
  </g>
</svg>
