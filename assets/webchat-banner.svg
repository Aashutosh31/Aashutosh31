<svg width="1000" height="280" viewBox="0 0 1000 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WebChat — real-time social communication platform: messaging, communities, voice and video.">
  <defs>
    <linearGradient id="w-bg" x1="0" y1="0" x2="1000" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <radialGradient id="w-gl1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(80 20) rotate(30) scale(420 320)">
      <stop stop-color="#7aa2f7" stop-opacity=".26"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="w-gl2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 300) rotate(205) scale(460 340)">
      <stop stop-color="#7dcfff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w-name" x1="40" y1="90" x2="420" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="w-bar" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <pattern id="w-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#2a2e42"/>
    </pattern>
    <clipPath id="w-clip"><rect width="1000" height="280" rx="16"/></clipPath>
    <style>
      .wmesh{stroke-dasharray:5 8;animation:wdash 3.2s linear infinite}
      @keyframes wdash{to{stroke-dashoffset:-52}}
      .wpulse{animation:wpulse 2.6s ease-in-out infinite}
      @keyframes wpulse{0%,100%{opacity:.35}50%{opacity:1}}
      .wbar{animation:wpulse 2.8s ease-in-out infinite}
    </style>
  </defs>

  <g clip-path="url(#w-clip)">
    <rect width="1000" height="280" fill="url(#w-bg)"/>
    <rect width="1000" height="280" fill="url(#w-gl1)"/>
    <rect width="1000" height="280" fill="url(#w-gl2)"/>
    <rect width="1000" height="280" fill="url(#w-dots)" opacity=".5"/>
    <rect width="5" height="280" fill="url(#w-bar)"/>

    <text x="42" y="64" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#7dcfff" letter-spacing="3">01 / REALTIME</text>
    <text x="42" y="122" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="54" font-weight="700" fill="url(#w-name)">WebChat</text>
    <text x="44" y="154" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="16" fill="#a9b1d6">Real-time social communication platform</text>

    <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13">
      <rect x="42" y="184" width="112" height="30" rx="15" fill="#1f2335" stroke="#7aa2f7"/>
      <text x="58" y="204" fill="#7aa2f7">Messaging</text>
      <rect x="166" y="184" width="126" height="30" rx="15" fill="#1f2335" stroke="#7dcfff"/>
      <text x="182" y="204" fill="#7dcfff">Communities</text>
      <rect x="304" y="184" width="144" height="30" rx="15" fill="#1f2335" stroke="#bb9af7"/>
      <text x="320" y="204" fill="#bb9af7">Voice &amp; Video</text>
    </g>

    <g fill="none" stroke-width="1.4">
      <line class="wmesh" x1="600" y1="70" x2="720" y2="52" stroke="#7aa2f7"/>
      <line class="wmesh" x1="720" y1="52" x2="840" y2="70" stroke="#7dcfff"/>
      <line class="wmesh" x1="600" y1="70" x2="760" y2="105" stroke="#7dcfff"/>
      <line class="wmesh" x1="760" y1="105" x2="840" y2="70" stroke="#bb9af7"/>
      <line class="wmesh" x1="840" y1="70" x2="890" y2="108" stroke="#7dcfff"/>
      <line class="wmesh" x1="760" y1="105" x2="890" y2="108" stroke="#7aa2f7"/>
    </g>
    <circle cx="600" cy="70" r="7" fill="#7aa2f7"/>
    <circle cx="720" cy="52" r="6" fill="#7dcfff" class="wpulse"/>
    <circle cx="840" cy="70" r="7" fill="#bb9af7"/>
    <circle cx="760" cy="105" r="8" fill="#7aa2f7" class="wpulse"/>
    <circle cx="890" cy="108" r="6" fill="#7dcfff"/>

    <rect x="560" y="138" width="184" height="42" rx="13" fill="#7aa2f7"/>
    <rect x="576" y="150" width="118" height="7" rx="3.5" fill="#1a1b26" opacity=".45"/>
    <rect x="576" y="163" width="78" height="7" rx="3.5" fill="#1a1b26" opacity=".45"/>

    <rect x="676" y="186" width="204" height="42" rx="13" fill="#24283b" stroke="#2f334d"/>
    <rect x="692" y="198" width="130" height="7" rx="3.5" fill="#565f89"/>
    <rect x="692" y="211" width="92" height="7" rx="3.5" fill="#565f89"/>

    <g fill="#7dcfff">
      <rect class="wbar" x="560" y="244" width="8" height="12" rx="4" opacity=".6"/>
      <rect class="wbar" x="580" y="238" width="8" height="24" rx="4" opacity=".8"/>
      <rect class="wbar" x="600" y="232" width="8" height="36" rx="4"/>
      <rect class="wbar" x="620" y="242" width="8" height="16" rx="4" opacity=".7"/>
      <rect class="wbar" x="640" y="234" width="8" height="32" rx="4"/>
      <rect class="wbar" x="660" y="244" width="8" height="12" rx="4" opacity=".6"/>
      <rect class="wbar" x="680" y="236" width="8" height="28" rx="4" opacity=".9"/>
      <rect class="wbar" x="700" y="242" width="8" height="16" rx="4" opacity=".7"/>
      <rect class="wbar" x="720" y="232" width="8" height="36" rx="4"/>
      <rect class="wbar" x="740" y="240" width="8" height="20" rx="4" opacity=".75"/>
      <rect class="wbar" x="760" y="234" width="8" height="32" rx="4" opacity=".85"/>
      <rect class="wbar" x="780" y="244" width="8" height="12" rx="4" opacity=".6"/>
      <rect class="wbar" x="800" y="232" width="8" height="36" rx="4"/>
      <rect class="wbar" x="820" y="240" width="8" height="20" rx="4" opacity=".75"/>
      <rect class="wbar" x="840" y="236" width="8" height="28" rx="4" opacity=".9"/>
      <rect class="wbar" x="860" y="244" width="8" height="12" rx="4" opacity=".6"/>
      <rect class="wbar" x="880" y="238" width="8" height="24" rx="4" opacity=".8"/>
      <rect class="wbar" x="900" y="234" width="8" height="32" rx="4"/>
      <rect class="wbar" x="920" y="244" width="8" height="16" rx="4" opacity=".7"/>
    </g>
  </g>
</svg>
