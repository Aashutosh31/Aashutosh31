<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aashutosh Bairagi — Full-Stack Engineer. Real-time systems, AI agents, backend engineering.">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1b26"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>
    <radialGradient id="h-gl1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 -40) rotate(30) scale(460 360)">
      <stop stop-color="#7aa2f7" stop-opacity=".30"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-gl2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 340) rotate(200) scale(460 360)">
      <stop stop-color="#bb9af7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-name" x1="56" y1="118" x2="540" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dcfff"/>
      <stop offset=".55" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="h-bar" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dcfff"/>
      <stop offset=".5" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <pattern id="h-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#2a2e42"/>
    </pattern>
    <clipPath id="h-clip"><rect width="1000" height="300" rx="16"/></clipPath>
    <style>
      .hcur{animation:hblink 1.15s steps(1) infinite}
      @keyframes hblink{50%{opacity:0}}
      .hpulse{animation:hpulse 2.4s ease-in-out infinite}
      @keyframes hpulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#h-clip)">
    <rect width="1000" height="300" fill="url(#h-bg)"/>
    <rect width="1000" height="300" fill="url(#h-gl1)"/>
    <rect width="1000" height="300" fill="url(#h-gl2)"/>
    <rect width="1000" height="300" fill="url(#h-dots)" opacity=".5"/>
    <rect width="5" height="300" fill="url(#h-bar)"/>

    <text x="58" y="70" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="14" fill="#7dcfff" letter-spacing="4">$ WHOAMI</text>

    <text x="55" y="150" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="50" font-weight="700" fill="url(#h-name)" letter-spacing=".5">Aashutosh Bairagi</text>

    <text x="58" y="190" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#c0caf5">Full-Stack Engineer · Real-Time Systems · AI Agents</text>

    <text x="58" y="220" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#a9b1d6">React · Node.js · Redis · Socket.IO · LiveKit · Docker</text>

    <circle cx="63" cy="248" r="4" fill="#9ece6a" class="hpulse"/>
    <text x="75" y="253" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#9ece6a">building &amp; shipping in public</text>

    <g>
      <rect x="556" y="50" width="392" height="200" rx="14" fill="#1f2335" stroke="#2f334d"/>
      <path d="M556 64a14 14 0 0 1 14-14h364a14 14 0 0 1 14 14v16H556z" fill="#24283b"/>
      <circle cx="580" cy="65" r="6" fill="#f7768e"/>
      <circle cx="600" cy="65" r="6" fill="#ff9e64"/>
      <circle cx="620" cy="65" r="6" fill="#9ece6a"/>
      <text x="642" y="70" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="11" fill="#565f89">aashutosh@arch: ~/engineering</text>
      <line x1="556" y1="80" x2="948" y2="80" stroke="#2f334d"/>

      <text x="576" y="112" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#9ece6a">$</text>
      <text x="592" y="112" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#c0caf5">ls projects/</text>

      <text x="576" y="138" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#7dcfff">webchat/</text>
      <text x="662" y="138" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#bb9af7">arc-ai/</text>
      <text x="740" y="138" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#c0caf5">receipts/</text>

      <text x="576" y="170" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#9ece6a">$</text>
      <text x="592" y="170" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#c0caf5">make reliable</text>

      <text x="576" y="196" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#7aa2f7">[ok]</text>
      <text x="612" y="196" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#a9b1d6">streaming · tools · memory</text>

      <text x="576" y="224" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="13" fill="#9ece6a">$</text>
      <rect x="592" y="214" width="9" height="13" fill="#7aa2f7" class="hcur"/>
    </g>
  </g>
</svg>
